<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earthquake Tracker - Live Radar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Modernized Electric Navbar -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="#home" class="active">Home</a></li>
            <li><a href="#info">Info</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="brand-logo">
            ⚡ <span>Earthquake</span> Tracker
        </div>
    </nav>

    <!-- Main Showcase Section -->
    <main>
        <!-- Centered Rounded Frame -->
        <div class="showcase-frame">
            <!-- 1. Top Column Welcome Message -->
            <h1 class="primary-message">
                Welcome to our app,<br>
                <span class="highlight">Earthquake Tracker : Live Radar</span>
            </h1>

            <!-- 2. Row with Icon Badge & Mobile Screenshot -->
            <div class="showcase-row">
                <!-- Icon Badge -->
                <div class="icon-badge">
                    <img src="images/earthquake.png" alt="App Icon Badge" class="badge-image" onerror="this.src='earthquake.png'">
                </div>

                <!-- Tab Screenshot -->
                <div class="mobile-screenshot-wrapper">
                    <img src="images/tab_nuclear_power_plant.png" alt="Mobile App Screenshot" class="mobile-screenshot" onerror="this.src='tab_nuclear_power_plant.png'">
                </div>
            </div>

            <!-- 3. Bottom Column Message -->
            <p class="sub-message">Track the quakes that you desire.</p>
        </div>

    </main>


    <!-- Centered Privacy Policy Outside The Frame -->
    <footer>
        <a href="privacy-policy.html" class="privacy-link">Privacy Policy</a>
    </footer>

</body>
</html>
